- id: D-ARC-SPLITTING-NUMERICAL
  kind: result
  area: explicit_cycles
  title: "Along the sixfold arc in characteristic 0 (floating point, eps = 1/40 .. 1/800): the transported class [P1] - [P2] splits F_eps into two cubics -+(2187/64) l^3 eps^-6 + ..., each with 8 linear vector fields; a matrix with det = the first one to 8e-20; the second matrix not found"
  statement: |-
    NUMERICAL throughout: multiprecision floating point (60 to 170 digits) at eps = 1/40, 1/64, 1/100, 1/800 on the
    one arc of D-SIXFOLD-ARC-ORDER19, with the class functional given by its exact series cut at order 19. The only
    error that matters is that truncation ("the noise"). Notation: Cat(2,2) = the 36 x 36 matrix lambda(m_a m_b) of
    the transported class [P1] - [P2] on quadratic monomials; l = y0 + z^4 y1 + z^4 y2 + z^2 y3 + z^2 y4 + y5
    (z = zeta_6), the tangent hyperplane of the Fermat cubic at the point P1 n P2.
    (1) Cat(2,2) has 12 singular values of size 113 to 527, 6 of size 13.9 eps^2 (four) and 76 to 77 eps^2 (two), and
    18 at the noise level (one exactly 0, the direction y5^2; the largest 2.6e-22, 2.2e-26, 2.9e-30, 2.5e-48, falling
    like eps^20, the smaller ones like eps^22). This is the picture of
    D-RANK-CONTRAST-EXACT-ARCS (12 units, 6 of valuation 2, 18 zeros), now with numbers.
    (2) y5^2 lies in the kernel exactly. The space of cubics all of whose eight partial derivatives lie in the kernel
    is 3-dimensional at the noise level: y5^3, F_eps and one more (the fourth singular value is 0.0265 eps^3).
    (3) In that space the members killed by some linear vector field are, up to scale: y5^3 and the cone
    Phi_eps = F_eps - y5^3 (trivially), and exactly two more, G_A and G_B, with F_eps = G_A + G_B (a consistency check
    that is not imposed holds to 1.2e-17, 1.6e-21, 4.4e-24, 2.8e-38).
    Their separation in the natural parameter is 0.0410 eps^6. G_A = -(2187/64) l^3 eps^-6 (1 + O(eps)) and
    G_B = +(2187/64) l^3 eps^-6 (1 + O(eps)): the coefficient of l^3 times eps^6 is -34.17287, -34.17212, -34.17194,
    -34.171875 at the four eps, and 2187/64 = 34.171875; the rest has relative size 0.753 eps.
    (4) Linear vector fields (singular values of the map L -> sum L_ij y_i dG/dy_j). G_A has 8 at every eps (8 values
    at the noise level); its 9th value is 8.7e-5 eps^8. G_B shows 9 values at the noise level at 1/40, 1/64, 1/100 and
    8 at 1/800, where the 9th (1.8e-38 = 0.99 eps^13) stands a factor 459 above the 8th and does not move when the
    series is cut at order 18 or 17 (blind check). So "G_B has exactly 8" rests on one value of eps. A general member
    of the 3-dimensional space has none.
    (5) A 3 x 3 matrix A of linear forms was obtained from the vector fields of G_A (the sl_3 method of
    detrep_lib.m2; the eigenvalues of a general element have the root pattern +-al, +-be, +-(al + be), 0, 0 to 1e-21
    at eps = 1/800): |det A - G_A| / |G_A| = 4.7e-5, 1.2e-9, 5.2e-11, 8.1e-20. That figure alone cannot tell G_A from
    -G_B = G_A - F_eps (|F_eps| / |G_A| is 1.0e-20). The sharper statement, from the blind check's linearised test at
    eps = 1/800: det A - G_A is an infinitesimal linear change of coordinates applied to G_A (a matrix of norm
    2.5e-11) up to 1.4e-40 |G_A|, the noise, whereas F_eps has a part of size 1.83 (of 2.83) outside those
    directions. So det A is, to first order and within the noise, G_A in slightly changed coordinates. The relation
    matrix of A has rank 3. Its nine entries span the 8 linear forms; its nine 2 x 2 minors are independent and lie in
    the kernel of Cat(2,2) (relative distance 8.3e-7, 8.6e-11, 2.2e-12, 4.9e-21). So on this arc one of the two nets
    of T2 is the net of 2 x 2 minors of an explicit matrix, numerically.
    (6) NOT obtained: a matrix for G_B, and therefore the identity det A + det B = F_eps. G_A + G_B = F_eps holds by
    (3); that G_B is a determinant is supported by nothing beyond the count 8 at eps = 1/800: its fields were not
    shown to form sl_3 (the blind check's Killing-form test is inconclusive).
    Reading: for a determinant of a 3 x 3 matrix whose entries span the 8 forms, with relation tr(C B) = 0, the
    algebra of vector fields has dimension 8, 9, 12 for rank C = 3, 2, 1 (EXACT over QQ on examples and normal
    forms, blind check). G_A is of the kind rank C = 3 and close to the kind rank C = 2 (its 9th field is broken at
    order eps^8); G_B is closer still (eps^13, one point). A cubic whose 8 fields form sl_3 acting by the adjoint
    representation is a multiple of such a determinant, since the invariant cubic of that representation is unique
    (ARG; the blind check found the argument sound).
  status: COMPUTED_ONLY
  conditions: |-
    Floating point, one arc, four values of eps, series cut at order 19: evidence, not a proof, and weaker than a
    MOD p rank. At eps = 1/16 and 1/25 the method fails to separate G_A from G_B (all 56 finite eigenvalues of the
    reduced problem crowd together, because both cubics are close to l^3, which has 56 vector fields); nothing is
    read from those runs. "At the noise level" is judged against the scatter of the eight eigenvalues of each
    group; the exponents (eps^2, eps^3, eps^6, eps^8, eps^20) are fits over four values of eps; eps^13 is one point.
    The value 2187/64 is a numerical identification (agreement to 8 digits at eps = 1/800), not derived.
    The matrix A is in the gauge the method produces; no normal form, no series in eps.
  evidence: |-
    leads/tenfold_twodet/matrices/mx4_pipeline.py; logs/mx4_eps16.log, mx4_eps40.log, mx4_eps64.log, mx4_eps100.log,
    mx4_eps800.log; results/mx4_eps40.json, mx4_eps64.json, mx4_eps100.json, mx4_eps800.json (G_A, G_B, F_eps and
    the matrix A to 60 digits); PREREG_matrices.md (predictions M5 to M8 written before the runs; three changes of
    method and one withdrawn statement recorded as they happened); leads/TENFOLD_TWODET_LEAD.md, section 8.
  independent_check: |-
    Blind check 12 (a separate agent, own code with python-flint at 900 bits and Macaulay2; it read neither the
    pipeline nor its logs, only the data files and the json results): the singular values of (1), the 3-dimensional
    space and the constant 0.0265 of (2), G_A + G_B = F_eps and the norms of (3), the singular values of (4) at all
    four eps, and the numbers of (5) all confirmed to the printed digits; the counts 8 / 9 / 12 of the reading
    confirmed EXACTLY over QQ (and MOD 32003) on random examples and normal forms, with none for a general cubic and
    for a general sum of two determinants. Corrections it made, all worked into the statement above: a constant of
    mine (8.7e-5, not 87, in front of eps^8); that the figure 8.1e-20 cannot tell G_A from -G_B and what does (its
    linearised test); that G_B shows 8 fields at one eps only, with its own test that the 9th value is not an
    artifact of the truncation; that nothing shows the fields of G_B to form sl_3. Not checked by anyone: uniqueness
    of the pair beyond the eigenvalue problem, a non-linear fit of A, any matrix B.
    leads/tenfold_twodet/blind_check12/REPORT.md (C2 to C6).
  not_established: |-
    That G_B is a determinant. det A + det B = F_eps at the noise level (the pre-registered test M7 was not reached).
    A non-linear fit of A to G_A (the agreement beyond 8e-20 is a first-order statement). Uniqueness of the pair
    (G_A, G_B) beyond what the eigenvalue problem finds.
    Anything away from this arc, in particular the statement D-W-MINUS1-IS-TWO-DET-CLOSURE about a whole component:
    the paper chain is not replaced. The matrices as series in eps, their leading forms, the flat limit of the
    threefold T and its class at the cubic of D (O-RECOVER-MATRICES-AND-LIMIT-OF-T stays open). An exact or MOD p
    version of (2)-(5).
  known_before: |-
    Team T2, modulo p over the series field: the splitting of the kernel into two nets with the numbers of 2 x 2
    minors, the two cubics +-c l^3 eps^-6 + ..., the valuation 12 of the square of the generator of the commuting
    algebra (D-DEGENERATION-ALONG-ARC). The sl_3 method for one determinantal cubic: detrep_lib.m2
    (D-COBLE-SECTION-TWO-DETERMINANTS). New here: characteristic 0; the 3-dimensional space with y5^3; the constants
    (2187/64, 0.0410, 0.753, 8.7e-5, 0.99); the count of vector fields with the two near-fields; an explicit matrix for
    one summand with its minors in the kernel.
  reproduce: |-
    From the repository root (Python 3 with mpmath, sympy, python-flint):
        python3 leads/tenfold_twodet/matrices/mx4_pipeline.py 1/100 leads/tenfold_twodet/matrices/periods_deg4_order19.txt leads/tenfold_twodet/matrices/arc_true_order19.txt 19 /tmp/out.json 90
    (about 6 minutes; for eps = 1/800 use 170 digits, about 10 minutes; MX4_VERBOSE=1 lists all eigenvalues).
  next_step: |-
    The second matrix. Its symmetry algebra is known only to (noise) / (0.99 eps^13), 0.3 per cent at eps = 1/800;
    the ratio improves only like eps^3. Routes: series of order about 30; an ansatz for B near the kind rank C = 2,
    [[a, b, c], [d, -a, e], [f, g, h]], order by order; a joint Gauss-Newton on det A + det B = F_eps (F_eps is known
    to 1e-45) from any rough B, in a rescaled gauge with plain multiprecision LU. Then the pre-registered M7 and a
    control with the series cut at order 13.
  session_refs: |-
    Session of 26 Nov 2026 (Claude Fable 5.2, chat), twelfth part (owner: 'queue this work up'; 'Go ahead').

- id: N-MATRIX-RECOVERY-FIRST-ATTEMPTS
  kind: dead_end
  area: methods
  title: "Recovering the matrices along the sixfold arc: what did not work (random-start least squares, order-9 series, eps >= 1/25, eigenforms in the original coordinates for the nearly degenerate summand)"
  statement: |-
    Tried on 26 Nov 2026 for O-RECOVER-MATRICES-AND-LIMIT-OF-T and found inadequate; each item says what failed and
    why, so that it is not repeated blindly. None of them says anything about the family itself.
    (1) Levenberg-Marquardt on the 144 complex entries of (A, B) against F_eps, random starts, double precision: no
    convergence even on a synthetic target det A0 + det B0 (rms residual 1 to 2.6 from 16 starts, up to 1500
    iterations). It converges quadratically only from within a relative perturbation of about 0.3 of a solution.
    A polisher, not a finder.
    (2) Splitting the kernel of Cat(2,2) by the commuting algebra from the order-9 series of the certificate arc: the
    generator is nearly nilpotent (eigenvalues +-c eps^6) and that series is good modulo eps^8 only
    (D-SIXFOLD-ARC-ORDER19, item 3): the two 9-dimensional eigenspaces cannot be resolved at any eps.
    (3) With the order-19 series: at eps = 1/16 and 1/25 the two special cubics are not separated (the noise is
    1e-14 to 1e-18 and all 56 finite eigenvalues lie within it of each other). eps <= 1/40 works.
    (4) The count of vector fields of the second summand at eps = 1/40, 1/64, 1/100 came out as 9. At eps = 1/800 it
    is 8: the 9th singular value is 0.99 eps^13 and had been below the noise. A count read at the noise level is a
    lower bound for what is broken, not a count.
    (5) Eigenforms of a random element of the symmetry algebra, computed in the coordinates y, for the second
    summand: the eigenvector matrix has condition number 1e11 (eps = 1/64) to 1e18 (1/800), and the algebra itself is
    known to 0.3 per cent at best; the resulting list of monomials is noise. For the first summand the same step
    works (condition number 1e5 to 1e7).
    (6) Two tools that failed as coded and were dropped: a balancing iteration over SL_8 (first version diverged, the
    safeguarded version did not move), and a Gauss-Newton polish whose linear solve in ball arithmetic fails on the
    badly scaled normal matrix.
  status: RULED_OUT
  conditions: |-
    "Ruled out" means these attempts as coded, at these values of eps and these precisions. In particular (6) is
    about two implementations, not about balancing or Gauss-Newton as ideas.
  evidence: |-
    leads/tenfold_twodet/matrices/PREREG_matrices.md (outcomes of the first route; the notes of 20:59, 21:06, 21:25
    UTC; outcomes of the second route), mx1_solve.py, mx2_split.py, logs/mx4_eps16.log;
    leads/TENFOLD_TWODET_LEAD.md, section 8.3.
  independent_check: |-
    Item 4 is confirmed by blind check 12 (nine values at the noise level at eps = 1/40, 1/64, 1/100, eight at 1/800;
    leads/tenfold_twodet/blind_check12/REPORT.md, C2). Items 1, 2, 3, 5, 6: none (my runs only).
  not_established: |-
    That no numerical method finds the second matrix. See D-ARC-SPLITTING-NUMERICAL, next_step.
  known_before: |-
    Team T2 already reported that order 25 modulo p was too little to recover the matrices
    (O-RECOVER-MATRICES-AND-LIMIT-OF-T).
  reproduce: |-
    From the repository root:
        python3 leads/tenfold_twodet/matrices/mx1_solve.py        (item 1; seconds)
        python3 leads/tenfold_twodet/matrices/mx2_split.py 0.05    (item 2; seconds)
        python3 leads/tenfold_twodet/matrices/mx4_pipeline.py 1/16 leads/tenfold_twodet/matrices/periods_deg4_order19.txt leads/tenfold_twodet/matrices/arc_true_order19.txt 19     (item 3; 5 minutes)
    Items 4 and 5: the logs of D-ARC-SPLITTING-NUMERICAL.
  do_not_repeat: |-
    Random-start least squares on (A, B). Any splitting from the certificate arc beyond eps^7. eps larger than 1/40
    with order-19 series. Reading a count of symmetries at the noise level as exact. Changing to the eigenforms of a
