    threefolds (-28, -42, -58, -82, -108). Triangle: the projected degree-7 scroll has the numbers (7, -1) of
    2h^3 + Pa + Pb - Pc but chi(N) = -12, so at best a sublocus [RULED OUT as the general cycle; its class STUCK];
