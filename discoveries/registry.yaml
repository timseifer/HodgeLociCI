        M2 --script pl1_count.m2 32003 1 B        (about 15 s; also 31991, seed 2, mode G)
        ./run_all.sh                              (all 8 runs)
  next_step: |-
    An exact version over a number field at one rational Coble cubic, if a stronger label is wanted.
  session_refs: |-
