# Rebuild the progress page (gh-pages) whenever the registry, the activity file or the page sources change on main.
# The page is a pure function of discoveries/registry.yaml, site/status.json and site/*; nothing else is published.
# The deploy is skipped when the registry check fails or when the page did not change (build timestamp ignored).
name: progress-page

on:
  push:
    branches: [main]
    paths:
      - "discoveries/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress-page
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Registry check (must print RESULT OK)
        run: |
          python3 discoveries/check_registry.py | tee /tmp/check.txt
          grep -q "RESULT: OK" /tmp/check.txt

      - name: Check out gh-pages
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add /tmp/ghp origin/gh-pages

      - name: Build
        run: |
          cp /tmp/ghp/index.html /tmp/old.html 2>/dev/null || touch /tmp/old.html
          python3 site/build_site.py /tmp/ghp

      - name: Deploy if changed
        run: |
          strip() { sed -E 's/"built": "[^"]*"//' "$1"; }
          if cmp -s <(strip /tmp/old.html) <(strip /tmp/ghp/index.html); then
            echo "Page unchanged; nothing to deploy."; exit 0
          fi
          cd /tmp/ghp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Progress page: rebuilt from main ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
