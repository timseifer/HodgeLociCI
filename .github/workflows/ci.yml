# CI: build the Docker image, then run the quickstart, the MCP server tests, the validation suite, the registry
# check and the progress-page build inside it. Nothing is pushed or published by this workflow.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: hodgelocici:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image ls hodgelocici:ci

      - name: Quickstart (default command; compares with examples/quickstart.expected)
        run: docker run --rm hodgelocici:ci

      - name: MCP server tests
        run: docker run --rm hodgelocici:ci python -m pytest mcp/tests -q -p no:cacheprovider

      - name: Validation suite (tests/run_all.sh)
        run: docker run --rm hodgelocici:ci tests/run_all.sh

      - name: Discoveries registry check
        run: docker run --rm hodgelocici:ci python3 discoveries/check_registry.py

      - name: Progress page builds
        run: docker run --rm hodgelocici:ci python3 site/build_site.py /tmp/_site
