# Publish the Docker image to the GitHub Container Registry as ghcr.io/timseifer/hodgelocici when a GitHub release
# is published.
#
# DISABLED: the job below has `if: false`, so this workflow never pushes anything. To enable it (owner's decision):
#   1. replace `if: false` with `if: github.event_name == 'release'` (or delete the line) and commit;
#   2. Settings -> Actions -> General -> Workflow permissions: the job asks for `packages: write` itself, which works
#      with the default settings; if the organisation restricts GITHUB_TOKEN, allow package writes there;
#   3. publish a release (a tag such as v0.1.2): the image is tagged with the version (0.1.2, 0.1) and `latest`;
#   4. after the first push, make the package public if wanted: github.com/users/timseifer/packages ->
#      hodgelocici -> Package settings -> Change visibility (new GHCR packages start private), and link it to
#      the repository there if it is not linked automatically.
name: Publish image to GHCR

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    # DISABLED until the repository owner approves publishing; see the comment at the top of this file.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image for a test run
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: hodgelocici:release-test

      - name: Quickstart must pass before anything is pushed
        run: docker run --rm hodgelocici:release-test

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/timseifer/hodgelocici
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
