[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hodgelocici-mcp"
version = "0.1.1"
description = "MCP server for the HodgeLociCI Macaulay2 package (Hodge loci of combinations of complete-intersection cycles). AI-generated, not reviewed by a human mathematician."
readme = "README.md"
license = "MIT"
authors = [{ name = "Timothy Seifert" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hodgelocici-mcp = "hodgelocici_mcp.server:main"

[project.urls]
Repository = "https://github.com/timseifer/HodgeLociCI"

[tool.setuptools]
packages = ["hodgelocici_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
